<html lang="{{LANG}}"><head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1116">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="{{BASE}}assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{BASE}}assets/style.css">
{{HREFLANG}}
<script>
/* Выбор языка.
   Заход по языковому адресу (/en/, /es/) — это явный выбор: уважаем и запоминаем.
   Догадка по языку браузера работает только на корневой, русской версии и только
   пока человек не выбрал язык сам. Скрипт стоит в <head> до отрисовки, чтобы
   страница не мигала чужим языком. */
(function(){
 var p=location.pathname, cur=/\/en\//.test(p)?'en':(/\/es\//.test(p)?'es':'ru');
 if(cur!=='ru'){ try{localStorage.setItem('w2w-lang',cur)}catch(e){} return; }
 var saved=null; try{saved=localStorage.getItem('w2w-lang')}catch(e){}
 var want=saved;
 if(!want){
   var n=(navigator.languages&&navigator.languages[0])||navigator.language||'ru';
   n=n.slice(0,2).toLowerCase();
   want=(n=='ru'||n=='en'||n=='es')?n:'en';   /* прочие языки — английский */
 }
 if(want==='ru') return;
 var f=p.replace(/^\//,''); if(!f) f='index.html';
 location.replace('/'+want+'/'+f);
})();
</script>
</head><body>
