<script>
/* Выбор языка.
   Заход по языковому адресу (/en/, /es/) — это явный выбор: уважаем и запоминаем.
   Догадка по языку браузера работает только на корневой, русской версии и только
   пока человек не выбрал язык сам. Скрипт стоит в <head> до отрисовки, чтобы
   страница не мигала чужим языком. */
(function(){
 var p=location.pathname, cur=/\/en\//.test(p)?'en':(/\/es\//.test(p)?'es':'ru');
 if(cur!=='ru'){ try{localStorage.setItem('w2w-lang',cur)}catch(e){} return; }
 var saved=null; try{saved=localStorage.getItem('w2w-lang')}catch(e){}
 var want=saved;
 if(!want){
   var n=(navigator.languages&&navigator.languages[0])||navigator.language||'ru';
   n=n.slice(0,2).toLowerCase();
   want=(n=='ru'||n=='en'||n=='es')?n:'en';   /* прочие языки — английский */
 }
 if(want==='ru') return;
 var f=p.replace(/^\//,''); if(!f) f='index.html';
 location.replace('/'+want+'/'+f);
})();
</script>
<script>
/* Статистика посещений — только после согласия.
   Метрика ставит куки и пишет сессию Вебвизором, поэтому скрипт грузится
   не сразу, а после ответа посетителя; ответ лежит в localStorage и больше
   не спрашивается. Отказ так же доступен, как согласие: иначе согласие
   не согласие. Без ответа не грузится ничего. */
(function(){
 var KEY='w2w-stats', ID=112331649;
 function load(){
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
   m[i].l=1*new Date();
   for(var j=0;j<e.scripts.length;j++){if(e.scripts[j].src===r){return}}
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,
   a.parentNode.insertBefore(k,a)})
  (window,document,'script','https://mc.yandex.ru/metrika/tag.js?id='+ID,'ym');
  ym(ID,'init',{webvisor:true,clickmap:true,trackLinks:true,accurateTrackBounce:true});
 }
 var saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
 if(saved==='yes'){ load(); return; }
 if(saved==='no'){ return; }
 function answer(v){
  try{localStorage.setItem(KEY,v)}catch(e){}
  var b=document.getElementById('cookiebar'); if(b) b.remove();
  if(v==='yes') load();
 }
 function bar(){
  var d=document.createElement('div'); d.id='cookiebar';
  var t=document.createElement('p'); t.textContent="{{priv.ask}}";
  var g=document.createElement('div'); g.className='cb-btns';
  var y=document.createElement('button'); y.textContent="{{priv.yes}}";
  var n=document.createElement('button'); n.className='cb-no'; n.textContent="{{priv.no}}";
  y.onclick=function(){answer('yes')}; n.onclick=function(){answer('no')};
  g.appendChild(y); g.appendChild(n); d.appendChild(t); d.appendChild(g);
  document.body.appendChild(d);
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bar);
 else bar();
})();
</script>
