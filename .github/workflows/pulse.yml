name: Пульс счёта

# Каждый час: обновляет блок «Счёт сейчас» на странице «Результаты»
# и проверяет, не случилось ли чего — тревоги уходят в Телеграм.
# Ленту недель не трогает — она собирается по субботам отдельным заданием.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Проверить связь с Телеграмом (прислать тестовое сообщение)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Скачать сводку счёта
        env:
          YD_PUBLIC: ${{ secrets.YD_PUBLIC }}
        run: |
          set -eu
          mkdir -p live
          for f in w2w_status.json w2w_trades.csv; do
            url=$(curl -sG --data-urlencode "public_key=$YD_PUBLIC" \
                        --data-urlencode "path=/$f" \
                        https://cloud-api.yandex.net/v1/disk/public/resources/download \
                  | python3 -c 'import sys,json; print(json.load(sys.stdin).get("href",""))')
            [ -n "$url" ] || { echo "нет ссылки на $f"; exit 1; }
            curl -sL "$url" -o "live/$f"
          done

      - name: Обновить пульс
        env:
          W2W_DATA: live
        run: |
          python3 bin/weekly_report.py --pulse
          python3 bin/i18n_build.py

      - name: Сторож — тревоги в Телеграм
        env:
          W2W_DATA: live
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 bin/tg_watch.py ${{ inputs.test && '--test' || '' }}

      - name: Опубликовать, если изменилось
        run: |
          git config user.name  'w2w'
          git config user.email 'w2w@users.noreply.github.com'
          rm -rf live
          git add -A
          if git diff --cached --quiet; then
            echo 'без изменений'
          else
            git commit -m "пульс $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
